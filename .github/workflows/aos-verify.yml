name: AOS Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate execution gate
        run: python .agent/01-core/execution_gate.py

      - name: Record compile evidence
        run: python .agent/01-core/evidence_recorder.py --check governance_compile

      - name: Record full verification evidence
        run: python .agent/01-core/evidence_recorder.py --check governance_verify

      - name: One-command consumer bootstrap smoke
        run: python .agent/governance/bootstrap_smoke.py

      - name: Validate current evidence bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path(".agent/evidence/current.json").read_text())
          checks = {item["check"]: item for item in data["checks"]}
          required = {"governance_compile", "governance_verify"}
          missing = required - checks.keys()
          if missing:
              raise SystemExit(f"missing evidence checks: {sorted(missing)}")
          failed = [name for name in required if checks[name]["status"] != "PASS"]
          if failed:
              raise SystemExit(f"failed evidence checks: {failed}")
          print("Evidence Bundle PASS:", sorted(required))
          PY

      - name: Archive evidence history
        run: python .agent/01-core/evidence_recorder.py --archive-current

      - name: Verify archived evidence integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util

          path = Path(".agent/01-core/evidence_recorder.py")
          spec = importlib.util.spec_from_file_location("evidence_recorder", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          archives = list(Path(".agent/evidence/history").glob("*.json"))
          if len(archives) != 1:
              raise SystemExit(f"expected exactly one evidence archive, got {len(archives)}")
          module.verify_archive(archives[0])
          print("Evidence History PASS:", archives[0].name)
          PY

      - name: Upload evidence history
        uses: actions/upload-artifact@v4
        with:
          name: aos-evidence-history
          path: .agent/evidence/history/*.json
          if-no-files-found: error

  launcher-smoke:
    name: Zero-setup launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bash launcher smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git branch launcher-smoke-source HEAD
          target="$(mktemp -d)"
          printf '{"scripts":{"build":"echo build","test":"echo test","lint":"echo lint"}}\n' > "$target/package.json"
          AOS_REPO_URL="file://${GITHUB_WORKSPACE}" AOS_REF="launcher-smoke-source" AOS_TARGET="$target" sh bootstrap.sh
          test -f "$target/.agent/profiles/project.json"

      - name: PowerShell launcher smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git branch launcher-smoke-source HEAD
          $target = Join-Path $env:RUNNER_TEMP "aos-launcher-consumer"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          '{"scripts":{"build":"echo build","test":"echo test","lint":"echo lint"}}' | Set-Content -Path (Join-Path $target "package.json")
          $env:AOS_REPO_URL = $env:GITHUB_WORKSPACE
          $env:AOS_REF = "launcher-smoke-source"
          $env:AOS_TARGET = $target
          & ./bootstrap.ps1
          if (-not (Test-Path (Join-Path $target ".agent/profiles/project.json"))) { throw "profile missing" }

# .pre-commit-config.yaml — Stack-Agnostic Template
# Local gate — runs before every commit
# Install: pip install pre-commit && pre-commit install
#
# Customize the formatting hook for your stack:
#   Python:     black --check / ruff check
#   JavaScript: prettier --check / eslint
#   Go:         gofmt -l / golangci-lint run
#   Rust:       cargo fmt --check / cargo clippy
#   .NET:       dotnet format --verify-no-changes

repos:
  # ── Secret Scan (universal) ──
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: "🔴 Secret scan (gitleaks)"

  # ── General hygiene checks (universal) ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json

  # ── Code formatting (CUSTOMIZE FOR YOUR STACK) ──
  # Uncomment ONE of the following blocks for your stack:


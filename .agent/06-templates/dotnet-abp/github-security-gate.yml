# .github/workflows/security-gate.yml
# 🔴 Automated Security Gate (AOS v7.0)
# No PR merges until every automatable step passes

name: ANLASH Security Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  MIN_COVERAGE: 70        # minimum coverage threshold — raise it gradually

jobs:
  gate:
    name: "🔒 Security Gate"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout code (full history)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history

      - name: "⚙️ Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── Step 3: Secret Scan ──
      - name: "🔴 Step 3: Secret scan (gitleaks)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Restore packages ──
      - name: "📦 Restore dependencies"
        run: dotnet restore

      # ── Step 2: Dependency Check ──
      - name: "🔴 Step 2: Check dependencies for vulnerabilities"
        run: |
          echo "Scanning for vulnerable packages..."
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q -E "Critical|High" vuln.txt; then
            echo "::error::❌ Critical/High vulnerability dependencies found — merge rejected"
            exit 1
          fi
          echo "✅ No critical vulnerabilities"

      # ── Step 5: Code Review (formatting + analyzers) ──
      - name: "🟡 Step 5: Format verification (dotnet format)"
        run: dotnet format --verify-no-changes --severity warn

      - name: "🔨 Build (Treat Warnings as Errors)"
        run: dotnet build --no-restore --configuration Release /warnaserror

      # ── Step 6: Test Verification + Coverage ──
      - name: "🔴 Step 6: Tests + coverage"
        run: |
          dotnet test --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "trx;LogFileName=results.trx"

      - name: "📊 Verify coverage threshold"
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          fail_below_min: true
          thresholds: '${{ env.MIN_COVERAGE }} 85'
          format: markdown
          output: both

      # ── Step 7: Gate Report ──
      - name: "📋 Step 7: Gate report on the PR"
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

  # ── Mandatory human gates ──
  human-review:
    name: "👤 Human review (steps 1 + 4)"
    runs-on: ubuntu-latest
    steps:
      - name: "Manual steps reminder"
        run: |
          echo "Step 1 (threat modeling) and step 4 (access review)"
          echo "are documented in the PR template and require a human reviewer's approval."

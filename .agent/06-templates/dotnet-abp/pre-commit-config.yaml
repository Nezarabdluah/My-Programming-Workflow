# .pre-commit-config.yaml
# Local gate — runs before every commit
# Install: pip install pre-commit && pre-commit install
repos:
  # ── Step 3: Secret Scan ──
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: "🔴 Secret scan (gitleaks)"

  # ── General hygiene checks ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files      # blocks files > 500KB
        args: ['--maxkb=500']
      - id: detect-private-key           # private keys
      - id: check-merge-conflict         # leftover merge markers
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json

  # ── Step 5: Code formatting (dotnet format) ──
  - repo: local
    hooks:
      - id: dotnet-format
        name: "🟡 Code formatting (dotnet format)"
        entry: dotnet format --verify-no-changes --severity warn
        language: system
        pass_filenames: false
        types: [c#]
